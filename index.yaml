project:
  name: "USHA CONSTRUCTION & ARCHITECT"
  slug: usha-construction-architect-platform
  type: public-website-plus-owner-admin-platform
  language: en
  locale: en-IN
  timezone: Asia/Kolkata
  location: "Chithod, Erode, Tamil Nadu, India"
  instruction_contract: AGENTS.md
runtime:
  public_site: HTML5/CSS3/vanilla-javascript
  api: Node.js 22, TypeScript, Fastify
  database: SQLite transactional persistence with JSON-shaped records
  admin_ui: React, Vite and TypeScript
  package_manager: npm workspaces
entrypoints:
  public_homepage: index.html
  api_server: apps/api/src/server.ts
  admin_dev_server: apps/admin
folders:
  apps/api: "TypeScript Fastify API, configuration, persistence and tests"
  apps/admin: "React/Vite/TypeScript owner login preview and development-only dashboard shell"
  packages/contracts: "Planned shared versioned JSON Schemas"
  content/blog: "Planned Markdown blog articles"
  content/news: "Planned Markdown news articles"
  data: "Runtime-only database and backups; never commit or publish"
  assets: "Brand, icons and approved website media"
  .github: "Repository automation and contribution instructions"
  docs: "Architecture, workflow, deployment, changelog and playbooks"
  scripts: "Static validation and maintenance scripts"
files:
  - path: AGENTS.md
    purpose: "Authoritative engineering, security, review and release contract"
  - path: README.md
    purpose: "Project onboarding and current implementation status"
  - path: index.html
    purpose: "Existing public website, preserved during admin migration"
  - path: index.yaml
    purpose: "Machine-readable project inventory and architecture"
  - path: package.json
    purpose: "npm workspace scripts and Node.js engine policy"
  - path: apps/admin/package.json
    purpose: "React/Vite admin UI dependencies and scripts"
  - path: apps/admin/src/main.tsx
    purpose: "Admin login preview and development-only empty dashboard shell"
  - path: apps/admin/src/styles.css
    purpose: "Responsive USHA admin design system"
  - path: apps/api/package.json
    purpose: "API dependencies and validation scripts"
  - path: apps/api/src/config.ts
    purpose: "Validated API environment configuration"
  - path: apps/api/src/db.ts
    purpose: "SQLite connection and initial relational schema"
  - path: apps/api/src/app.ts
    purpose: "Fastify app, security middleware and health endpoints"
  - path: apps/api/src/server.ts
    purpose: "API process lifecycle and graceful shutdown"
  - path: apps/api/src/app.test.ts
    purpose: "API health and database schema tests"
  - path: docs/ADMIN_ARCHITECTURE.md
    purpose: "Phased owner admin architecture and security plan"
  - path: docs/PROJECT_WORKFLOW.md
    purpose: "Issue-first implementation, validation and browser verification"
  - path: docs/DEPLOYMENT.md
    purpose: "Public static site and separately approved API deployment plan"
quality:
  api_tests: "npm test"
  typecheck: "npm run typecheck"
  admin_build: "npm run build:admin"
  api_build: "npm run build:api"
  public_site_validator: "python scripts/validate_site.py"
  browser_verification: "Manual connected interactive browser; do not use Playwright"
version_control:
  default_branch: main
  feature_branch_convention: "feature/issue-<number>-<slug>"
  pull_request_required: true
  direct_main_commits: false
  merge_requires_ci_and_owner_approval: true
hosting:
  public_site_provider: Render
  public_site_service_type: Static Site
  public_site_service_id: "srv-dc07sdd6e07s73bu49og"
  public_site_url: "https://usha-construction-architect.onrender.com"
  public_site_auto_deploy_branch: main
  api_status: source-only-not-deployed
  api_hosting_requires_owner_approval: true
  persistent_storage_requires_owner_approval: true
