project:
  name: "USHA CONSTRUCTION & ARCHITECT"
  slug: usha-construction-architect-platform
  type: public-website-plus-owner-admin-platform
  language: en
  locale: en-IN
  timezone: Asia/Kolkata
  location: "Chithod, Erode, Tamil Nadu, India"
  instruction_contract: AGENTS.md
runtime:
  public_site: HTML5/CSS3/vanilla-javascript
  api: Node.js 22, TypeScript, Fastify
  database: SQLite transactional persistence with ordered SHA-256-checksummed migrations
  contracts: "@usha/contracts, Zod runtime schemas and inferred TypeScript types"
  admin_ui: planned component-based TypeScript frontend
  package_manager: npm workspaces
entrypoints:
  public_homepage: index.html
  api_server: apps/api/src/server.ts
  api_openapi: GET /api/v1/openapi.json
  owner_provisioning: npm run provision:owner
  public_enquiry_api: POST /api/v1/public/enquiries
folders:
  apps/api: "TypeScript Fastify API, domain modules, configuration, persistence and tests"
  apps/admin: "Planned component-based owner admin frontend"
  packages/contracts: "Shared versioned request/response schemas and TypeScript types"
  content/blog: "Planned Markdown blog articles"
  content/news: "Planned Markdown news articles"
  data: "Runtime-only database and backups; never commit or publish"
  assets: "Brand, icons and approved website media"
  .github: "Repository automation and contribution instructions"
  docs: "Architecture, workflow, deployment, changelog and playbooks"
  scripts: "Static validation and maintenance scripts"
files:
  - path: AGENTS.md
    purpose: "Authoritative engineering, security, review and release contract"
  - path: README.md
    purpose: "Project onboarding and current implementation status"
  - path: package.json
    purpose: "npm workspaces and provisioning/build/test scripts"
  - path: apps/api/src/app.ts
    purpose: "Fastify setup, security middleware, module registration and error handling"
  - path: apps/api/src/modules/auth/routes.ts
    purpose: "Owner login, sessions, CSRF, logout and password change"
  - path: apps/api/src/modules/enquiries/routes.ts
    purpose: "Consent-based public enquiry capture and idempotent lead persistence"
  - path: apps/api/src/cli/provision-owner.ts
    purpose: "One-time private owner account provisioning"
  - path: apps/api/src/auth.test.ts
    purpose: "Owner authentication, origin, cookie, CSRF and revocation tests"
  - path: apps/api/src/enquiries.test.ts
    purpose: "Enquiry persistence, retry, consent, spam and validation tests"
  - path: apps/api/src/db.ts
    purpose: "SQLite connection and migration bootstrap"
  - path: apps/api/src/db/migrations.ts
    purpose: "Ordered SQL migrations, SHA-256 checksums and legacy upgrade logic"
  - path: apps/api/src/db.test.ts
    purpose: "Migration replay, checksum drift, legacy upgrade and append-only tests"
  - path: packages/contracts/src/index.ts
    purpose: "Shared Zod request/response schemas and TypeScript types"
  - path: docs/api/README.md
    purpose: "API versioning, errors, OpenAPI, pagination and validation conventions"
  - path: docs/ADMIN_ARCHITECTURE.md
    purpose: "Phased owner admin architecture and security plan"
  - path: docs/PROJECT_WORKFLOW.md
    purpose: "Issue-first implementation, validation and browser verification"
  - path: docs/DEPLOYMENT.md
    purpose: "Public static site and separately approved API deployment plan"
  - path: docs/INSTRUCTION_CHANGELOG.md
    purpose: "Durable instruction and workflow changes"
quality:
  api_tests: "npm test"
  api_typecheck: "npm run typecheck"
  api_build: "npm run build:api"
  public_site_validator: "python scripts/validate_site.py"
  browser_verification: "Manual connected interactive browser; do not use Playwright"
version_control:
  default_branch: main
  feature_branch_convention: "feature/issue-<number>-<slug>"
  pull_request_required: true
  direct_main_commits: false
  merge_requires_ci_and_owner_approval: true
hosting:
  public_site_provider: Render
  public_site_service_type: Static Site
  public_site_service_id: "srv-dc07sdd6e07s73bu49og"
  public_site_url: "https://usha-construction-architect.onrender.com"
  public_site_auto_deploy_branch: main
  api_status: source-only-not-deployed
  api_hosting_requires_owner_approval: true
  persistent_storage_requires_owner_approval: true
